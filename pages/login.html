<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Minco</title>
  <link rel="icon" href="../assets/img/mincologo.png" type="image/png" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/api.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="logo">
        <img src="../assets/img/mincologo.png" alt="Minco logo" class="logo-img" />
        <span class="logo-text">Minco</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="../index.html">Home</a>
        <a href="register.html" class="btn btn-small btn-primary">Create account</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="../assets/img/mincologo.png" alt="Minco logo" class="logo-img" />
        <strong>Minco</strong>
      </div>
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to continue to your supportive community.</p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-full" type="submit">Log in</button>
      </form>

      <div class="demo-box">
        <strong>Demo login:</strong><br />
        Email: <code>demo@minco.app</code><br />
        Password: <code>minco123</code><br />
        <button id="fillDemo" type="button">Autofill demo details →</button>
      </div>

      <p class="auth-switch">New to Minco? <a href="register.html">Create account</a></p>
    </div>
  </main>

</body>
</html>
